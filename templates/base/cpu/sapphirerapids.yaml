spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require: [sapphirerapids]
      providers:
        awk: [gawk]
        blas: [openblas, amdblis]
        D: [ldc]
        daal: [intel-daal]
        elf: [elfutils]
        fftw-api: [fftw, amdfftw]
        flame: [libflame, amdlibflame]
        fuse: [libfuse]
        gl: [mesa+opengl, mesa18, opengl]
        glu: [mesa-glu, openglu]
        glx: [mesa+glx, mesa18+glx, opengl]
        golang: [gcc]
        iconv: [libiconv]
        ipp: [intel-ipp]
        java: [openjdk, jdk, ibm-java]
        jpeg: [libjpeg-turbo, libjpeg]
        lapack: [openblas, amdlibflame]
        libllvm: [llvm, llvm-amdgpu]
        lua-lang: [lua, lua-luajit]
        mariadb-client: [mariadb-c-client, mariadb]
        mkl: [intel-mkl]
        mpe: [mpe2]
        mpi: [openmpi, mpich]
        mysql-client: [mysql, mariadb-c-client]
        opencl: [pocl]
        onedal: [intel-oneapi-dal]
        osmesa: [mesa+osmesa, mesa18+osmesa]
        pbs: [openpbs, torque]
        pil: [py-pillow]
        pkgconfig: [pkgconf, pkg-config]
        rpc: [libtirpc]
        scalapack: [netlib-scalapack, amdscalapack]
        sycl: [hipsycl]
        szip: [libaec, libszip]
        tbb: [intel-tbb]
        unwind: [libunwind]
        uuid: [util-linux-uuid, libuuid]
        xxd: [xxd-standalone, vim]
        yacc: [bison, byacc]
        ziglang: [zig]
    c:
      require: "gcc target=sapphirerapids"
      prefer:
        - gcc@13.4.0
    cxx:
      require: "gcc target=sapphirerapids"
      prefer:
        - gcc@13.4.0
    fortran:
      require: "gcc target=sapphirerapids"
      prefer:
        - gcc@13.4.0
    llvm:
      require: "target=sapphirerapids"
      version: [17.0.6, 18.1.8]
    clang:
      require: "target=sapphirerapids"
      version: [17.0.6, 18.1.8]
    intel-oneapi-compilers:
      require: "target=sapphirerapids"
    boost:
      require: "@1.77:"
    libxml2:
      require: '@2.13.9'
    gcc:
      externals:
      - spec: gcc@14.3.1 target=sapphirerapids languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 target=sapphirerapids languages:='c,c++,fortran'
        prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-7ivyxcqhpvfztht4s4sui4qs4twelkjl
        extra_attributes:
          compilers:
            c: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-7ivyxcqhpvfztht4s4sui4qs4twelkjl/bin/gcc
            cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-7ivyxcqhpvfztht4s4sui4qs4twelkjl/bin/g++
            fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-7ivyxcqhpvfztht4s4sui4qs4twelkjl/bin/gfortran
      # - spec: gcc@11.5.0 target=sapphirerapids languages:='c,c++,fortran'
      #   prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-13.4.0/gcc-11.5.0-g3qyf4iehz2iecd5lnudbiayiyax7n7v
      #   extra_attributes:
      #     compilers:
      #       c: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-13.4.0/gcc-11.5.0-g3qyf4iehz2iecd5lnudbiayiyax7n7v/bin/gcc
      #       cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-13.4.0/gcc-11.5.0-g3qyf4iehz2iecd5lnudbiayiyax7n7v/bin/g++
      #       fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-13.4.0/gcc-11.5.0-g3qyf4iehz2iecd5lnudbiayiyax7n7v/bin/gfortran
