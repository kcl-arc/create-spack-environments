spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  modules:
    default:
      tcl:
        hide_implicits: true
        exclude: [gcc-runtime, glibc]
  packages:
    all:
      require: ["target=zen4"]
    c:
      require:
        - any_of: ["gcc target=zen4", "nvhpc target=zen4"]
      prefer:
        - gcc@13.4.0
    cxx:
      require:
        - any_of: ["gcc target=zen4", "nvhpc target=zen4"]
      prefer:
        - gcc@13.4.0
    fortran:
      require:
        - any_of: ["gcc target=zen4", "nvhpc target=zen4"]
      prefer:
        - gcc@13.4.0
    llvm:
      require: "target=zen4"
      version: [17.0.6, 18.1.8]
    clang:
      require: "target=zen4"
      version: [17.0.6, 18.1.8]
    intel-oneapi-compilers:
      require: "target=zen4"
    boost:
      require: "@1.77: target=zen4"
    libxml2:
      require: '@2.13.9 target=zen4'
    petsc:
      require: "+batch target=zen4"
    mctc-lib:
      require: "@0.5.1: target=zen4"
    xtb:
      require: "~tblite target=zen4"
    curl:
      require: "+libidn2 target=zen4"
    openmpi:
      require: ["target=zen4"]
    r:
      require: ["target=zen4"]
    gcc:
      externals:
      - spec: gcc@14.3.1 target=zen4 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 target=zen4 languages:='c,c++,fortran'
        prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf
        extra_attributes:
          compilers:
            c: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf/bin/gcc
            cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf/bin/g++
            fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf/bin/gfortran
