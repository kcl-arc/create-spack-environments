spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  modules:
    default:
      tcl:
        hide_implicits: true
        exclude: [gcc-runtime, glibc]
  packages:
    all:
      require: ["target=skylake_avx512"]
    c:
      require: "gcc target=skylake_avx512"
      # prefer:
      #   - gcc@12.5.0
    cxx:
      require: "gcc target=skylake_avx512"
      # prefer:
      #   - gcc@12.5.0
    fortran:
      require: "gcc target=skylake_avx512"
      # prefer:
      #   - gcc@12.5.0
    llvm:
      require: "target=skylake_avx512"
      version: [15.0.7]
    clang:
      require: "target=skylake_avx512"
      version: [15.0.7]
    intel-oneapi-compilers:
      require: "target=skylake_avx512"
    boost:
      require: "@1.77:  target=skylake_avx512"
    libxml2:
      require: "@2.13.9 target=skylake_avx512"
    petsc:
      require: "+batch target=skylake_avx512"
    mctc-lib:
      require: "@0.5.1: target=skylake_avx512"
    xtb:
      require: "~tblite target=skylake_avx512"
    curl:
      require: "+libidn2 target=skylake_avx512"
    openmpi:
      require: ["target=skylake_avx512"]
    r:
      require: ["target=skylake_avx512"]
    gcc:
      externals:
      - spec: gcc@14.3.1 target=skylake_avx512 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      # - spec: gcc@12.5.0 target=skylake_avx512 languages:='c,c++,fortran'
