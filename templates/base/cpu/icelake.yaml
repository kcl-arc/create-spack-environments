spack:
  view: false
  concretizer:
    unify: when_possible
  packages:
    all:
      target: [icelake]
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 languages:='c,c++,fortran'
