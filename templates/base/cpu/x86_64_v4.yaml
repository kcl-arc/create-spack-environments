spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target: [x86_64_v4]
    gcc:
      externals:
      - spec: gcc@14.3.1 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
  specs:
    - gcc@13.4.0
    # - llvm@17.0.6
    # - llvm@18.1.8
