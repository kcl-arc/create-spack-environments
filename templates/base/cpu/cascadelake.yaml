spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require: ["target=cascadelake"]
    c:
      require: "gcc target=cascadelake"
      # prefer:
      #   - gcc@12.5.0
    cxx:
      require: "gcc target=cascadelake"
      # prefer:
      #   - gcc@12.5.0
    fortran:
      require: "gcc target=cascadelake"
      # prefer:
      #   - gcc@12.5.0
    llvm:
      require: "target=cascadelake"
      version: [15.0.7]
    clang:
      require: "target=cascadelake"
      version: [15.0.7]
    intel-oneapi-compilers:
      require: "target=cascadelake"
    boost:
      require: "@1.77: target=cascadelake"
    libxml2:
      require: '@2.13.9 target=cascadelake'
    petsc:
      require: "+batch target=cascadelake"
    mctc-lib:
      require: "@0.5.1: target=cascadelake"
    xtb:
      require: "~tblite target=cascadelake"
    curl:
      require: "+libidn2 target=cascadelake"
    openmpi:
      require: ["target=cascadelake"]
    r:
      require: ["target=cascadelake"]
    gcc:
      externals:
      - spec: gcc@14.3.1 target=cascadelake languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      # - spec: gcc@12.5.0 target=cascadelake languages:='c,c++,fortran'
