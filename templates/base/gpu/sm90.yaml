# Hopper architecture (sm_90): H100, H200
spack:
  packages:
    cuda:
      version: ["13.3"]
    lammps:
      variants: +cuda cuda_arch=90
    nccl:
      variants: +cuda cuda_arch=90
    llvm:
      version: [17.0.6]
    clang:
      version: [17.0.6]
  specs:
    - cuda@13.3
    - cudnn@9.21.0.82-13
    - cuda@12.9
    - cudnn@9.21.0.82-12
    - namd@3.0.2 +cuda cuda_arch=90 ^cuda@12
    - dorado +cuda cuda_arch=90
    - py-boltz +cuda ^py-torch+cuda cuda_arch=90
    - aretomo
    - cellranger@7.2.0
    - motioncor2
    - lammps +cuda cuda_arch=90
