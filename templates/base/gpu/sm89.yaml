# Ada Lovelace architecture (sm_89): L40S
spack:
  packages:
    cuda:
      version: ["13.3"]
    lammps:
      variants: +cuda cuda_arch=89
    nccl:
      variants: +cuda cuda_arch=89
    llvm:
      version: [18.1.8]
    clang:
      version: [18.1.8]
  specs:
    - cuda@13.3
    - cudnn@9.21.0.82-13
    - cuda@12.9
    - cudnn@9.21.0.82-12
    - namd@3.0.2 +cuda cuda_arch=89 ^cuda@12
    # - namd@2.14 +cuda cuda_arch=89 %gcc@11.5.0 ^cuda@11.8.0 ^charmpp@6.10.2
    - dorado +cuda cuda_arch=89
    - py-boltz +cuda ^py-torch+cuda cuda_arch=89
    - aretomo
    - cellranger@7.2.0
