# Ampere data-centre architecture (sm_80): A30, A100 (40 GB), A100 (80 GB)
spack:
  packages:
    cuda:
      version: ["13.3"]
    lammps:
      variants: +cuda cuda_arch=80
    nccl:
      variants: +cuda cuda_arch=80
    llvm:
      version: [15.0.7]
    clang:
      version: [15.0.7]
  specs:
    - cuda@13.3
    - cudnn@9.21.0.82-13
    - cuda@12.9
    - cudnn@9.21.0.82-12
    - namd@3.0.2 +cuda cuda_arch=80 ^cuda@12
    # - namd@2.14 +cuda cuda_arch=80 %gcc@11.5.0 ^cuda@11.8.0 ^charmpp@6.10.2
    - dorado +cuda cuda_arch=80
    - py-boltz +cuda ^py-torch+cuda cuda_arch=80
    - aretomo
    - cellranger@7.2.0
    - motioncor2
    - lammps +cuda cuda_arch=80
    # to install next (moved from templates/overlay/test/, removed 2026-10-04)
