# CPU x GPU family matrix used to generate concrete environments.

settings:
  modules_root_base: /software/spack_v1_2_1/install/modules
  modules_tcl_projections:
    all: "{name}/{version}"
    hdf5+hl ^mpi: "{name}/{version}-hl-{^mpi.name}_{^mpi.version}"
    hdf5+hl: "{name}/{version}-hl"
    namd+cuda: "{name}/{version}-cuda"

# slurm_features defaults to [<family name>] when omitted -- every family
# below uses a single Slurm feature token identical to its family name, so
# adding a new one is just `<name>: {}`. Only set slurm_features explicitly
# if a family's live Slurm token(s) differ from its family name.
cpu_families:
  icelake: {}
  skylake_avx512: {}
  cascadelake: {}
  sapphirerapids: {}
  x86_64_v4: {}
  zen2: {}
  zen3: {}
  zen4: {}
  zen5: {}

gpu_families:
  cpu:
    cuda_enabled: false
    slurm_features: []
  sm75:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "75"
    slurm_features: [rtx2070, rtx2080, titan_rtx]
  sm86:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "86"
    slurm_features: [rtx3070, rtx3090, a40]
  sm80:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "80"
    slurm_features: [a30, a100, a100_40g, a100_80g]
  sm90:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "90"
    slurm_features: [h100, h200]
  sm100:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "100"
    slurm_features: [b200, rtx6000]
  sm89:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "89"
    slurm_features: [l40s]

# Enabled environment pairs to render.
# If omitted or left empty, generate_envs.py derives pairs from matrix/features_to_family.yaml.
# enabled_pairs:
