# CPU x GPU family matrix used to generate concrete environments.

settings:
  modules_root_base: /software/spack_v1_2_1/install/modules
  container_format: singularity
  modules_tcl_projections:
    all: "{name}/{version}"
    ^mpi: "{name}/{version}-{^mpi.name}_{^mpi.version}"
    ^hwloc: "{name}/{version}-hwloc_{^hwloc.version}"
    ^llvm: "{name}/{version}-{^llvm.name}_{^llvm.version}"
    ^python: "{name}/{version}-{^python.name}_{^python.version}"
    boost+container: "{name}/{version}-container"
    eigen build_type=Release: "{name}/{version}-release"
    threads=openmp: "{name}/{version}-omp"
  modules_tcl_exclude:
    - meson
    - ninja
    - re2c
    - cairo
    - glib
    - glib-bootstrap
    - gobject-introspection
    - harfbuzz
    - pixman
    - python-venv
    - py-attrs
    - py-calver
    - py-certifi
    - py-cffi
    - py-cryptography
    - py-cython
    - py-flit-core
    - py-gsutil
    - py-hatch-fancy-pypi-readme
    - py-hatch-vcs
    - py-hatchling
    - py-idna
    - py-markupsafe
    - py-maturin
    - py-multiqc
    - py-mysql-connector-python
    - py-packaging
    - py-pathspec
    - py-pillow
    - py-pip
    - py-pluggy
    - py-poetry-core
    - py-pycparser
    - py-pyparsing
    - py-pyyaml
    - py-requests
    - py-semantic-version
    - py-setuptools
    - py-setuptools-rust
    - py-setuptools-scm
    - py-six
    - py-trove-classifiers
    - py-typing-extensions
    - py-urllib3
    - py-wheel

cpu_families:
  icelake:
    slurm_features: [icelake]
  skylake_avx512:
    slurm_features: [skylake_avx512]
  cascadelake:
    slurm_features: [cascadelake]
  sapphirerapids:
    slurm_features: [sapphirerapids]
  x86_64_v4:
    slurm_features: [x86_64_v4]
  zen2:
    slurm_features: [zen2]
  zen3:
    slurm_features: [zen3]
  zen4:
    slurm_features: [zen4]

gpu_families:
  cpu:
    cuda_enabled: false
    slurm_features: []
  sm61:
    cuda_enabled: true
    preferred_cuda_version: "12.8"
    preferred_cuda_arch: "61"
    slurm_features: [titan_x, titan_xp]
  sm70:
    cuda_enabled: true
    preferred_cuda_version: "12.8"
    preferred_cuda_arch: "70"
    slurm_features: [titan_v]
  sm75:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "75"
    slurm_features: [rtx2070, rtx2080, titan_rtx]
  sm86:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "86"
    slurm_features: [rtx3070, rtx3090, a40]
  sm80:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "80"
    slurm_features: [a30, a100, a100_40g, a100_80g]
  sm90:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "90"
    slurm_features: [h100, h200]
  sm100:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "100"
    slurm_features: [b200, rtx6000]
  sm89:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "89"
    slurm_features: [l40s]

# Enabled environment pairs to render.
# If omitted or left empty, refresh_env_matrix.sh called and derives pairs from matrix/features_to_family.yaml.
# enabled_pairs:
