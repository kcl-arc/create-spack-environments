# CPU x GPU family matrix used to generate concrete environments.

settings:
  modules_root_base: /software/spack_v1_2_1/install/modules
  container_format: singularity
  modules_tcl_projections:
    all: "{name}/{version}"
    hdf5+hl ^mpi: "{name}/{version}-hl-{^mpi.name}_{^mpi.version}"
    hdf5+hl: "{name}/{version}-hl"
    namd+cuda cuda_arch=61: "{name}/{version}-cuda61"
    namd+cuda cuda_arch=70: "{name}/{version}-cuda70"
    namd+cuda cuda_arch=75: "{name}/{version}-cuda75"
    namd+cuda cuda_arch=80: "{name}/{version}-cuda80"
    namd+cuda cuda_arch=86: "{name}/{version}-cuda86"
    namd+cuda cuda_arch=89: "{name}/{version}-cuda89"
    namd+cuda cuda_arch=90: "{name}/{version}-cuda90"
    namd+cuda cuda_arch=100: "{name}/{version}-cuda100"
    namd+avxtiles: "{name}/{version}-avxtiles"
    # curl+libidn2 ^zlib: "{name}/{version}-idn2-zlib"
    curl+libidn2: "{name}/{version}-idn2"
    fftw+openmp ^mpi: "{name}/{version}-omp-{^mpi.name}_{^mpi.version}"
    ^mpi: "{name}/{version}-{^mpi.name}_{^mpi.version}"
    # ^hwloc ^zlib: "{name}/{version}-hwloc_{^hwloc.version}-zlib"
    ^hwloc: "{name}/{version}-hwloc_{^hwloc.version}"
    ^llvm: "{name}/{version}-{^llvm.name}_{^llvm.version}"
    # ^python ^zlib: "{name}/{version}-{^python.name}_{^python.version}-zlib"
    ^python: "{name}/{version}-{^python.name}_{^python.version}"
    boost+container+icu: "{name}/{version}-container-icu"
    boost+container: "{name}/{version}-container"
    boost+icu: "{name}/{version}-icu"
    boost+pic: "{name}/{version}-pic"
    htslib~libcurl: "{name}/{version}-nocurl"
    cgal ^boost+icu: "{name}/{version}-icu"
    # ^zlib: "{name}/{version}-zlib"
    cmake@3.31.11 ^curl+libidn2: "{name}/{version}-idn2"
    cmake@3.31.11 ^curl@:8.15: "{name}/{version}-curl_{^curl.version}"
    git ^curl@:8.15: "{name}/{version}-curl_{^curl.version}"
    gdal ^curl+libidn2: "{name}/{version}-idn2"
    proj ^curl+libidn2: "{name}/{version}-idn2"
    arrow ^cmake %curl+libidn2: "{name}/{version}-idn2"
    geos ^cmake %curl+libidn2: "{name}/{version}-idn2"
    eigen build_type=Release: "{name}/{version}-release"
    threads=openmp: "{name}/{version}-omp"

# slurm_features defaults to [<family name>] when omitted -- every family
# below uses a single Slurm feature token identical to its family name, so
# adding a new one is just `<name>: {}`. Only set slurm_features explicitly
# if a family's live Slurm token(s) differ from its family name.
cpu_families:
  icelake: {}
  skylake_avx512: {}
  cascadelake: {}
  sapphirerapids: {}
  x86_64_v4: {}
  zen2: {}
  zen3: {}
  zen4: {}
  zen5: {}

gpu_families:
  cpu:
    cuda_enabled: false
    slurm_features: []
  sm61:
    cuda_enabled: true
    preferred_cuda_version: "12.8"
    preferred_cuda_arch: "61"
    slurm_features: [titan_x, titan_xp]
  sm70:
    cuda_enabled: true
    preferred_cuda_version: "12.8"
    preferred_cuda_arch: "70"
    slurm_features: [titan_v]
  sm75:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "75"
    slurm_features: [rtx2070, rtx2080, titan_rtx]
  sm86:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "86"
    slurm_features: [rtx3070, rtx3090, a40]
  sm80:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "80"
    slurm_features: [a30, a100, a100_40g, a100_80g]
  sm90:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "90"
    slurm_features: [h100, h200]
  sm100:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "100"
    slurm_features: [b200, rtx6000]
  sm89:
    cuda_enabled: true
    preferred_cuda_version: "13.3"
    preferred_cuda_arch: "89"
    slurm_features: [l40s]

# Enabled environment pairs to render.
# If omitted or left empty, refresh_env_matrix.sh called and derives pairs from matrix/features_to_family.yaml.
# enabled_pairs:
