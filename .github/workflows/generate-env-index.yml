name: generate-env-index

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode"
        required: true
        default: "pr"
        type: choice
        options:
          - pr
          - direct-staging
  push:
    branches-ignore: [staging, production]
    paths:
      - matrix/env_matrix.yaml
      - templates/**
      - scripts/generate_envs.py
      - environments/bespoke/**/spack.yaml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR mode)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'pr') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout staging (direct mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'direct-staging' }}
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: Regenerate manifests and index
        run: |
          python scripts/generate_envs.py

      - name: Commit generated changes to current branch
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'pr') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/generated environments/index.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate env manifests and index"
          git push origin "${GITHUB_REF_NAME}"

      - name: Commit directly to staging
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'direct-staging' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/generated environments/index.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate env manifests and index"
          git push origin staging
