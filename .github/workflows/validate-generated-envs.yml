name: Validate Generated Environments

on:
  pull_request:
    branches: [staging]
    paths:
      - matrix/**
      - templates/**
      - environments/generated/**
      - environments/index.yaml
      - scripts/generate_envs.py
      - .github/workflows/validate-generated-envs.yml
  push:
    branches: [production]
    paths:
      - matrix/**
      - templates/**
      - environments/generated/**
      - environments/index.yaml
      - scripts/generate_envs.py

permissions:
  contents: read

jobs:
  validate-generated-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate generated environments are current
        run: python3 scripts/generate_envs.py --check
