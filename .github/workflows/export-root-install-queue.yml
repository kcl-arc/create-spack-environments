name: Export Root Install Queue

on:
  workflow_dispatch:
  pull_request:
    paths:
      - environments/index.yaml
      - environments/generated/**
      - scripts/export_root_install_queue.py
      - .github/workflows/export-root-install-queue.yml
  push:
    branches-ignore: [staging, production]
    paths:
      - environments/index.yaml
      - environments/generated/**
      - scripts/export_root_install_queue.py
      - .github/workflows/export-root-install-queue.yml

jobs:
  export-root-install-queue:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Export root install queue
        run: python3 scripts/export_root_install_queue.py

      - name: Commit generated root install queue to current branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'staging' && github.head_ref != 'production' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/root_install_queue.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate root install queue"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: root-install-queue
          path: environments/root_install_queue.yaml
          if-no-files-found: error
