spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - skylake_avx512
      compiler:
      - gcc@12.5.0
    c:
      prefer:
      - gcc@12.5.0
    cxx:
      prefer:
      - gcc@12.5.0
    fortran:
      prefer:
      - gcc@12.5.0
    llvm:
      version:
      - 15.0.7
    clang:
      version:
      - 15.0.7
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@12.5.0 languages:='c,c++,fortran'
        prefix: ''
        extra_attributes:
          compilers:
            c: ''
            cxx: ''
            fortran: ''
    cuda:
      buildable: false
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-skylake-cpu/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
