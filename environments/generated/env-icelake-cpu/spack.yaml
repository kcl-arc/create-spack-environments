spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require:
      - target=icelake
    c:
      require: gcc target=icelake
    cxx:
      require: gcc target=icelake
    fortran:
      require: gcc target=icelake
    llvm:
      require: target=icelake
      version:
      - 15.0.7
    clang:
      require: target=icelake
      version:
      - 15.0.7
    intel-oneapi-compilers:
      require: target=icelake
    boost:
      require: '@1.77: target=icelake'
    libxml2:
      require: '@2.13.9 target=icelake'
    petsc:
      require: +batch target=icelake
    mctc-lib:
      require: '@0.5.1: target=icelake'
    xtb:
      require: ~tblite target=icelake
    curl:
      require: +libidn2 target=icelake
    openmpi:
      require:
      - target=icelake
    r:
      require:
      - target=icelake
    gcc:
      externals:
      - spec: gcc@14.3.1 target=icelake languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    cuda:
      buildable: false
  specs:
  - gcc@12.5.0
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_2_1/install/modules/env-icelake-cpu/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}'
        projections:
          all: '{name}/{version}'
          hdf5+hl ^mpi: '{name}/{version}-hl-{^mpi.name}_{^mpi.version}'
          hdf5+hl: '{name}/{version}-hl'
          namd+cuda cuda_arch=61: '{name}/{version}-cuda61'
          namd+cuda cuda_arch=70: '{name}/{version}-cuda70'
          namd+cuda cuda_arch=75: '{name}/{version}-cuda75'
          namd+cuda cuda_arch=80: '{name}/{version}-cuda80'
          namd+cuda cuda_arch=86: '{name}/{version}-cuda86'
          namd+cuda cuda_arch=89: '{name}/{version}-cuda89'
          namd+cuda cuda_arch=90: '{name}/{version}-cuda90'
          namd+cuda cuda_arch=100: '{name}/{version}-cuda100'
          namd+avxtiles: '{name}/{version}-avxtiles'
          curl+libidn2 ^zlib: '{name}/{version}-idn2-zlib'
          curl+libidn2: '{name}/{version}-idn2'
          ^mpi: '{name}/{version}-{^mpi.name}_{^mpi.version}'
          ^hwloc ^zlib: '{name}/{version}-hwloc_{^hwloc.version}-zlib'
          ^hwloc: '{name}/{version}-hwloc_{^hwloc.version}'
          ^llvm: '{name}/{version}-{^llvm.name}_{^llvm.version}'
          ^python ^zlib: '{name}/{version}-{^python.name}_{^python.version}-zlib'
          ^python: '{name}/{version}-{^python.name}_{^python.version}'
          boost+container: '{name}/{version}-container'
          boost+icu: '{name}/{version}-icu'
          ^zlib: '{name}/{version}-zlib'
          cmake@3.31.11 ^curl+libidn2: '{name}/{version}-idn2'
          cmake@3.31.11 ^curl@:8.15: '{name}/{version}-curl_{^curl.version}'
          git ^curl@:8.15: '{name}/{version}-curl_{^curl.version}'
          gdal ^curl+libidn2: '{name}/{version}-idn2'
          proj ^curl+libidn2: '{name}/{version}-idn2'
          arrow ^cmake %curl+libidn2: '{name}/{version}-idn2'
          geos ^cmake %curl+libidn2: '{name}/{version}-idn2'
          eigen build_type=Release: '{name}/{version}-release'
          threads=openmp: '{name}/{version}-omp'
        exclude:
        - meson
        - ninja
        - re2c
        - cairo
        - glib
        - glib-bootstrap
        - gobject-introspection
        - harfbuzz
        - libraqm
        - pixman
        - bdftopcf
        - font-util
        - fontconfig
        - freetype
        - graphite2
        - libdeflate
        - libjpeg-turbo
        - libpng
        - libtiff
        - libxfont
        - libxft
        - mkfontdir
        - mkfontscale
        - pango
        - python-venv
        - py-attrs
        - py-calver
        - py-certifi
        - py-cffi
        - py-contourpy
        - py-cppy
        - py-cryptography
        - py-cycler
        - py-cython
        - py-flit-core
        - py-fonttools
        - py-gsutil
        - py-hatch-fancy-pypi-readme
        - py-hatch-vcs
        - py-hatchling
        - py-idna
        - py-importlib-metadata
        - py-kiwisolver
        - py-markupsafe
        - py-matplotlib
        - py-maturin
        - py-meson-python
        - py-multiqc
        - py-mysql-connector-python
        - py-packaging
        - py-pathspec
        - py-pillow
        - py-pip
        - py-pluggy
        - py-poetry-core
        - py-pybind11
        - py-pycparser
        - py-pyparsing
        - py-python-dateutil
        - py-pyyaml
        - py-requests
        - py-scikit-build-core
        - py-semantic-version
        - py-setuptools
        - py-setuptools-rust
        - py-setuptools-scm
        - py-six
        - py-trove-classifiers
        - py-typing-extensions
        - py-urllib3
        - py-wheel
        - py-zipp
        - findutils
        - gettext
        - libtool
        - binutils
        - elfutils
        - flatbuffers
        - fribidi
        - icu4c
        - json-c
        - json-glib
        - krb5
        - lerc
        - libfontenc
        - libgeotiff
        - libgit2
        - libtirpc
        - libx11
        - libxcb
        - libxext
        - libxml2
        - libxmu
        - libxrender
        - libxscrnsaver
        - libxt
        - muparser
        - qhull
        - rapidjson
        - xcb-proto
        - xsimd
        - flex
        - texinfo
  container:
    format: singularity
