spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require:
      - cascadelake
      providers:
        awk:
        - gawk
        blas:
        - openblas
        - amdblis
        D:
        - ldc
        daal:
        - intel-daal
        elf:
        - elfutils
        fftw-api:
        - fftw
        - amdfftw
        flame:
        - libflame
        - amdlibflame
        fuse:
        - libfuse
        gl:
        - mesa+opengl
        - mesa18
        - opengl
        glu:
        - mesa-glu
        - openglu
        glx:
        - mesa+glx
        - mesa18+glx
        - opengl
        golang:
        - gcc
        iconv:
        - libiconv
        ipp:
        - intel-ipp
        java:
        - openjdk
        - jdk
        - ibm-java
        jpeg:
        - libjpeg-turbo
        - libjpeg
        lapack:
        - openblas
        - amdlibflame
        libllvm:
        - llvm
        - llvm-amdgpu
        lua-lang:
        - lua
        - lua-luajit
        mariadb-client:
        - mariadb-c-client
        - mariadb
        mkl:
        - intel-mkl
        mpe:
        - mpe2
        mpi:
        - openmpi
        - mpich
        mysql-client:
        - mysql
        - mariadb-c-client
        opencl:
        - pocl
        onedal:
        - intel-oneapi-dal
        osmesa:
        - mesa+osmesa
        - mesa18+osmesa
        pbs:
        - openpbs
        - torque
        pil:
        - py-pillow
        pkgconfig:
        - pkgconf
        - pkg-config
        rpc:
        - libtirpc
        scalapack:
        - netlib-scalapack
        - amdscalapack
        sycl:
        - hipsycl
        szip:
        - libaec
        - libszip
        tbb:
        - intel-tbb
        unwind:
        - libunwind
        uuid:
        - util-linux-uuid
        - libuuid
        xxd:
        - xxd-standalone
        - vim
        yacc:
        - bison
        - byacc
        ziglang:
        - zig
    c:
      prefer:
      - gcc@12.5.0
    cxx:
      prefer:
      - gcc@12.5.0
    fortran:
      prefer:
      - gcc@12.5.0
    llvm:
      version:
      - 18.1.8
    clang:
      version:
      - 18.1.8
    boost:
      require: '@1.77:'
    gcc:
      externals:
      - spec: gcc@14.3.1 target=cascadelake languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@12.5.0 target=cascadelake languages:='c,c++,fortran'
        prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-cascadelake/gcc-14.3.1/gcc-12.5.0-3ypwwcfpn7yep6ptlg2oewkiqp4ldg63
        extra_attributes:
          compilers:
            c: /software/spack_v1_2_1/install/apps/linux-almalinux10-cascadelake/gcc-14.3.1/gcc-12.5.0-3ypwwcfpn7yep6ptlg2oewkiqp4ldg63/bin/gcc
            cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-cascadelake/gcc-14.3.1/gcc-12.5.0-3ypwwcfpn7yep6ptlg2oewkiqp4ldg63/bin/g++
            fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-cascadelake/gcc-14.3.1/gcc-12.5.0-3ypwwcfpn7yep6ptlg2oewkiqp4ldg63/bin/gfortran
    cuda:
      version:
      - '13.3'
    lammps:
      variants: +cuda cuda_arch=75
    nccl:
      variants: +cuda cuda_arch=75
  specs:
  - gcc@12.5.0
  - cmake@3.31.11
  - curl
  - hdf5@1.14.6~mpi +hl
  - hdf5@1.14.6+mpi +hl ^openmpi@5.0.8
  - intel-oneapi-compilers@2026.0.0
  - intel-oneapi-mkl@2026.0.0+shared threads=openmp
  - intel-oneapi-mpi@2021.18.0
  - netcdf-c
  - netlib-scalapack@2.2.3+shared build_type=Release
  - openmpi
  - llvm-openmp
  - zlib
  - fmt
  - zstd
  - bazel
  - beagle
  - bedtools2
  - bgen
  - bismark
  - bison
  - blast-plus
  - bwa
  - circos
  - coordgen
  - cryoef
  - eigen build_type=RelWithDebInfo
  - exonerate
  - fastp
  - fastqc
  - ffmpeg
  - gatk
  - gdal
  - gemma
  - git-lfs
  - gnuplot
  - gradle
  - hisat2
  - impute2
  - ldak
  - libhugetlbfs
  - libwebp +libwebpmux
  - libxc
  - meme +magick
  - mesa
  - meson
  - miniforge3
  - mysql +client_only
  - nextflow
  - openbabel ~python ~gui
  - p7zip
  - parallel
  - pcre
  - perl-appconfig
  - perl-config-simple
  - perl-file-remove
  - perl-file-sharedir
  - perl-file-slurp
  - perl-getopt-argvfile
  - perl-http-date
  - perl-module-install
  - perl-parallel-forkmanager
  - perl-parse-yapp
  - perl-parselex
  - perl-parsetemplate
  - perl-pathtools
  - perl-termreadkey
  - perl-test-leaktrace
  - picard
  - plink2
  - postgresql +client_only
  - py-gsutil
  - py-multiqc
  - py-mysql-connector-python
  - samtools
  - shapeit4
  - spark +hadoop
  - star
  - stringtie
  - subread
  - tabix
  - tcsh
  - trimgalore
  - trimmomatic
  - vcftools
  - wget
  - wtdbg2
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_2_1/install/modules/env-cascadelake-sm75-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}'
        projections:
          all: '{name}/{version}'
          ^mpi: '{name}/{version}-mpi-{^mpi.name}'
          boost+container: '{name}/{version}-container'
          eigen build_type=Release: '{name}/{version}-release'
          threads=openmp: '{name}/{version}-omp'
          llvm ^hwloc: '{name}/{version}-hwloc{^hwloc.version}'
          mesa ^hwloc: '{name}/{version}-hwloc{^hwloc.version}'
        exclude:
        - meson
        - ninja
        - re2c
        - rust
        - cairo
        - glib
        - glib-bootstrap
        - gobject-introspection
        - harfbuzz
        - pixman
        - python-venv
        - py-*
  container:
    format: singularity
