spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require:
      - target=sapphirerapids
    c:
      require: gcc target=sapphirerapids
      prefer:
      - gcc@13.4.0
    cxx:
      require: gcc target=sapphirerapids
      prefer:
      - gcc@13.4.0
    fortran:
      require: gcc target=sapphirerapids
      prefer:
      - gcc@13.4.0
    llvm:
      require: target=sapphirerapids
      version:
      - 17.0.6
    clang:
      require: target=sapphirerapids
      version:
      - 17.0.6
    intel-oneapi-compilers:
      require: target=sapphirerapids
    boost:
      require: '@1.77: target=sapphirerapids'
    libxml2:
      require: '@2.13.9 target=sapphirerapids'
    petsc:
      require: +batch target=sapphirerapids
    mctc-lib:
      require: '@0.5.1: target=sapphirerapids'
    xtb:
      require: ~tblite target=sapphirerapids
    curl:
      require: +libidn2 target=sapphirerapids
    openmpi:
      require:
      - target=sapphirerapids
    r:
      require:
      - target=sapphirerapids
    gcc:
      externals:
      - spec: gcc@14.3.1 target=sapphirerapids languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 target=sapphirerapids languages:='c,c++,fortran'
        prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-ydbendvp4dwxt6ieh7nfxv5bj5wwzzj3
        extra_attributes:
          compilers:
            c: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-ydbendvp4dwxt6ieh7nfxv5bj5wwzzj3/bin/gcc
            cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-ydbendvp4dwxt6ieh7nfxv5bj5wwzzj3/bin/g++
            fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-sapphirerapids/gcc-14.3.1/gcc-13.4.0-ydbendvp4dwxt6ieh7nfxv5bj5wwzzj3/bin/gfortran
    cuda:
      version:
      - '13.3'
    lammps:
      variants: +cuda cuda_arch=90
    nccl:
      variants: +cuda cuda_arch=90
