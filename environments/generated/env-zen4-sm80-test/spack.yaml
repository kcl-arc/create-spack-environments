spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - zen4
    c:
      prefer:
      - gcc@13.4.0
    cxx:
      prefer:
      - gcc@13.4.0
    fortran:
      prefer:
      - gcc@13.4.0
    llvm:
      version:
      - 15.0.7
    clang:
      version:
      - 15.0.7
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-13.4.0-wr6hgh2fgxoqxjpdul5nbm5eqtpvkipt
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-13.4.0-wr6hgh2fgxoqxjpdul5nbm5eqtpvkipt/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-13.4.0-wr6hgh2fgxoqxjpdul5nbm5eqtpvkipt/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-13.4.0-wr6hgh2fgxoqxjpdul5nbm5eqtpvkipt/bin/gfortran
          environment:
            set:
              CUDAFLAGS: -allow-unsupported-compiler
              NVCCFLAGS: -allow-unsupported-compiler
              NVCC_APPEND_FLAGS: -allow-unsupported-compiler
    cuda:
      version:
      - '12.2'
    lammps:
      variants: +cuda cuda_arch=80
    nccl:
      variants: +cuda cuda_arch=80
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-zen4-sm80-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
