spack:
  view: false
  concretizer:
    unify: when_possible
  packages:
    all:
      target:
      - skylake_avx512
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    cuda:
      version:
      - '11.8'
    lammps:
      variants: +cuda cuda_arch=70
    nccl:
      variants: +cuda cuda_arch=70
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-skylake-legacy-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
