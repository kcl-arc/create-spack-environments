spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - skylake_avx512
    c:
      prefer:
      - gcc@12.5.0
    cxx:
      prefer:
      - gcc@12.5.0
    fortran:
      prefer:
      - gcc@12.5.0
    llvm:
      version:
      - 18.1.8
    clang:
      version:
      - 18.1.8
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@12.5.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap/bin/gfortran
    cuda:
      version:
      - '13.3'
    lammps:
      variants: +cuda cuda_arch=75
    nccl:
      variants: +cuda cuda_arch=75
  specs:
  - cmake@4.1.2
  - curl@8.15.0
  - hdf5@1.14.6~mpi +hl
  - hdf5@1.14.6+mpi +hl ^openmpi@5.0.8
  - intel-oneapi-compilers@2025.3.1
  - intel-oneapi-mkl@2025.3.0+shared threads=openmp
  - intel-oneapi-mpi@2021.17.0
  - netcdf-c@4.9.3
  - netlib-scalapack@2.2.2+shared build_type=Release
  - openmpi@5.0.8
  - llvm-openmp@20.1.8
  - zlib@1.3.1
  - fmt
  - zstd
  - bazel@7.4.1
  - beagle
  - bedtools2
  - bgen
  - bismark
  - bison
  - blast-plus
  - bwa
  - circos
  - coordgen
  - cryoef
  - eigen build_type=RelWithDebInfo
  - exonerate
  - fastp
  - fastqc
  - ffmpeg
  - gatk
  - gdal
  - gemma
  - git-lfs
  - gnuplot
  - gradle
  - hisat2
  - impute2
  - ldak
  - libhugetlbfs
  - libwebp +libwebpmux
  - libxc
  - meme +magick
  - mesa
  - meson
  - miniforge3
  - mysql +client_only
  - nextflow
  - openbabel ~python ~gui
  - p7zip
  - parallel
  - pcre
  - perl-appconfig
  - perl-config-simple
  - perl-file-remove
  - perl-file-sharedir
  - perl-file-slurp
  - perl-getopt-argvfile
  - perl-http-date
  - perl-module-install
  - perl-parallel-forkmanager
  - perl-parse-yapp
  - perl-parselex
  - perl-parsetemplate
  - perl-pathtools
  - perl-termreadkey
  - perl-test-leaktrace
  - picard
  - plink2@2.0.0-a.6.9
  - postgresql +client_only
  - py-gsutil
  - py-multiqc
  - py-mysql-connector-python
  - samtools
  - shapeit4
  - spark +hadoop
  - star
  - stringtie
  - subread
  - tabix
  - tcsh
  - trimgalore
  - trimmomatic
  - vcftools
  - wget
  - wtdbg2
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-skylake_avx512-sm75/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}'
        projections:
          all: '{name}/{version}'
          +mpi: '{name}/{version}-mpi'
  container:
    format: singularity
