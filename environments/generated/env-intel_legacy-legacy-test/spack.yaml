spack:
  view: false
  concretizer:
    unify: when_possible
  packages:
    all:
      target:
      - cascadelake
      - skylake_avx512
    cuda:
      version:
      - '11.8'
    lammps:
      variants: +cuda cuda_arch=70
    nccl:
      variants: +cuda cuda_arch=70
  specs:
  - zlib
  - cmake
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-intel_legacy-legacy/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
