spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - zen3
    c:
      prefer:
      - gcc@13.4.0
    cxx:
      prefer:
      - gcc@13.4.0
    fortran:
      prefer:
      - gcc@13.4.0
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen3/gcc-13.3.0/gcc-13.4.0-we4ydfijph5dzx7aspiapxq2m4xx64hq
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen3/gcc-13.3.0/gcc-13.4.0-we4ydfijph5dzx7aspiapxq2m4xx64hq/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen3/gcc-13.3.0/gcc-13.4.0-we4ydfijph5dzx7aspiapxq2m4xx64hq/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen3/gcc-13.3.0/gcc-13.4.0-we4ydfijph5dzx7aspiapxq2m4xx64hq/bin/gfortran
    cuda:
      buildable: false
  specs: []
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-zen3-cpu/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
