spack:
  view: false
  concretizer:
    unify: when_possible
  packages:
    all:
      target:
      - icelake
    cuda:
      version:
      - '12.4'
    lammps:
      variants: +cuda cuda_arch=90
    nccl:
      variants: +cuda cuda_arch=90
  specs:
  - zlib
  - cmake
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-icelake-sm90/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
