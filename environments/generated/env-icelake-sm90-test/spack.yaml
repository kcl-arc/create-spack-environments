spack:
  view: false
  concretizer:
    unify: when_possible
  packages:
    all:
      target:
      - icelake
    cuda:
      version:
      - '12.4'
    lammps:
      variants: +cuda cuda_arch=90
    nccl:
      variants: +cuda cuda_arch=90
    c:
      prefer:
      - gcc@13.4.0
    cxx:
      prefer:
      - gcc@13.4.0
    fortran:
      prefer:
      - gcc@13.4.0
  specs:
  - zlib@1.3.1
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-icelake-sm90-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
