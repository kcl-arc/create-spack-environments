spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - icelake
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-13.4.0-jjr6dlmwmblaqupv7vbgvj3gu4ecdzms
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-13.4.0-jjr6dlmwmblaqupv7vbgvj3gu4ecdzms/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-13.4.0-jjr6dlmwmblaqupv7vbgvj3gu4ecdzms/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-13.4.0-jjr6dlmwmblaqupv7vbgvj3gu4ecdzms/bin/gfortran
      c:
        prefer:
        - gcc@13.4.0
      cxx:
        prefer:
        - gcc@13.4.0
      fortran:
        prefer:
        - gcc@13.4.0
    cuda:
      version:
      - '12.4'
    lammps:
      variants: +cuda cuda_arch=90
    nccl:
      variants: +cuda cuda_arch=90
  specs:
  - zlib@1.3.1
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-icelake-sm90-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
