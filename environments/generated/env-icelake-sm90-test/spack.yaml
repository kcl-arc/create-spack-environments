spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - icelake
    c:
      prefer:
      - gcc@12.5.0
    cxx:
      prefer:
      - gcc@12.5.0
    fortran:
      prefer:
      - gcc@12.5.0
    llvm:
      version:
      - 17.0.6
    clang:
      version:
      - 17.0.6
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@12.5.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-12.5.0-eypqskxwjysr3iayxmxyg4itmr66n7f2
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-12.5.0-eypqskxwjysr3iayxmxyg4itmr66n7f2/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-12.5.0-eypqskxwjysr3iayxmxyg4itmr66n7f2/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-icelake/gcc-13.3.0/gcc-12.5.0-eypqskxwjysr3iayxmxyg4itmr66n7f2/bin/gfortran
    cuda:
      version:
      - '12.8'
    lammps:
      variants: +cuda cuda_arch=90
    nccl:
      variants: +cuda cuda_arch=90
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-icelake-sm90-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
        projections:
          all: '{name}/{version}-{compiler.name}-{compiler.version}'
          +mpi: '{name}/{version}-{compiler.name}-{compiler.version}-mpi'
  container:
    format: singularity
