spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require:
      - zen4
      providers:
        awk:
        - gawk
        blas:
        - openblas
        - amdblis
        D:
        - ldc
        daal:
        - intel-daal
        elf:
        - elfutils
        fftw-api:
        - fftw
        - amdfftw
        flame:
        - libflame
        - amdlibflame
        fuse:
        - libfuse
        gl:
        - mesa+opengl
        - mesa18
        - opengl
        glu:
        - mesa-glu
        - openglu
        glx:
        - mesa+glx
        - mesa18+glx
        - opengl
        golang:
        - gcc
        iconv:
        - libiconv
        ipp:
        - intel-ipp
        java:
        - openjdk
        - jdk
        - ibm-java
        jpeg:
        - libjpeg-turbo
        - libjpeg
        lapack:
        - openblas
        - amdlibflame
        libllvm:
        - llvm
        - llvm-amdgpu
        lua-lang:
        - lua
        - lua-luajit
        mariadb-client:
        - mariadb-c-client
        - mariadb
        mkl:
        - intel-mkl
        mpe:
        - mpe2
        mpi:
        - openmpi
        - mpich
        mysql-client:
        - mysql
        - mariadb-c-client
        opencl:
        - pocl
        onedal:
        - intel-oneapi-dal
        osmesa:
        - mesa+osmesa
        - mesa18+osmesa
        pbs:
        - openpbs
        - torque
        pil:
        - py-pillow
        pkgconfig:
        - pkgconf
        - pkg-config
        rpc:
        - libtirpc
        scalapack:
        - netlib-scalapack
        - amdscalapack
        sycl:
        - hipsycl
        szip:
        - libaec
        - libszip
        tbb:
        - intel-tbb
        unwind:
        - libunwind
        uuid:
        - util-linux-uuid
        - libuuid
        xxd:
        - xxd-standalone
        - vim
        yacc:
        - bison
        - byacc
        ziglang:
        - zig
    c:
      prefer:
      - gcc@13.4.0
    cxx:
      prefer:
      - gcc@13.4.0
    fortran:
      prefer:
      - gcc@13.4.0
    llvm:
      version:
      - 17.0.6
      - 18.1.8
    clang:
      version:
      - 17.0.6
      - 18.1.8
    gcc:
      externals:
      - spec: gcc@14.3.1 target=zen4 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 target=zen4 languages:='c,c++,fortran'
        prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-flefgfk4ggtpc5ajggnxp5pbbyk5czl2
        extra_attributes:
          compilers:
            c: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-flefgfk4ggtpc5ajggnxp5pbbyk5czl2/bin/gcc
            cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-flefgfk4ggtpc5ajggnxp5pbbyk5czl2/bin/g++
            fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-flefgfk4ggtpc5ajggnxp5pbbyk5czl2/bin/gfortran
    cuda:
      buildable: false
  specs:
  - gcc@13.4.0
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_2_1/install/modules/env-zen4-cpu-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}'
        projections:
          all: '{name}/{version}'
          +mpi: '{name}/{version}-mpi'
  container:
    format: singularity
