spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - zen4
    c:
      prefer:
      - gcc@15.2.0
    cxx:
      prefer:
      - gcc@15.2.0
    fortran:
      prefer:
      - gcc@15.2.0
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@15.2.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-15.2.0-ifahvp22nsy4gxyoopsfshj2qrq4uzeh
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-15.2.0-ifahvp22nsy4gxyoopsfshj2qrq4uzeh/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-15.2.0-ifahvp22nsy4gxyoopsfshj2qrq4uzeh/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-zen4/gcc-13.3.0/gcc-15.2.0-ifahvp22nsy4gxyoopsfshj2qrq4uzeh/bin/gfortran
    cuda:
      buildable: false
  specs:
  - zlib@1.3.1
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-zen4-cpu-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
