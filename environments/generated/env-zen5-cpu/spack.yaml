spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  modules:
    default:
      tcl:
        hide_implicits: true
        exclude:
        - gcc-runtime
        - glibc
        hash_length: 0
        naming_scheme: '{name}/{version}'
        projections:
          all: '{name}/{version}'
          hdf5+hl ^mpi: '{name}/{version}-hl-{^mpi.name}_{^mpi.version}'
          hdf5+hl: '{name}/{version}-hl'
          namd+cuda: '{name}/{version}-cuda'
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_2_1/install/modules/env-zen5-cpu/
  packages:
    all:
      require:
      - target=zen5
    c:
      require:
      - any_of:
        - gcc target=zen5
        - nvhpc target=zen5
      prefer:
      - gcc@14.3.1
    cxx:
      require:
      - any_of:
        - gcc target=zen5
        - nvhpc target=zen5
      prefer:
      - gcc@14.3.1
    fortran:
      require:
      - any_of:
        - gcc target=zen5
        - nvhpc target=zen5
      prefer:
      - gcc@14.3.1
    llvm:
      require: target=zen5
      version:
      - 19.1.7
      - 21.1.4
    clang:
      require: target=zen5
      version:
      - 19.1.7
      - 21.1.4
    intel-oneapi-compilers:
      require: target=zen5
    boost:
      require: '@1.77: target=zen5'
    libxml2:
      require: '@2.13.9 target=zen5'
    petsc:
      require: +batch target=zen5
    mctc-lib:
      require: '@0.5.1: target=zen5'
    xtb:
      require: ~tblite target=zen5
    curl:
      require: +libidn2 target=zen5
    openmpi:
      require:
      - target=zen5
    r:
      require:
      - target=zen5
    charmpp:
      require: cflags="-fpermissive" target=zen5
    hdf5:
      require:
      - target=zen5
      - spec: cflags="-fpermissive"
        when: '@:1.8'
    sox:
      require: cflags="-fpermissive" target=zen5
    gcc:
      externals:
      - spec: gcc@14.3.1 target=zen5 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    cuda:
      buildable: false
  specs:
  - gcc@11.5.0
  - cmake
  - curl
  - hdf5@1.14.6~mpi +hl
  - hdf5@1.14.6+mpi +hl ^openmpi@5.0.8
  - intel-oneapi-compilers@2026.0.0
  - intel-oneapi-mkl@2026.0.0+shared threads=openmp
  - intel-oneapi-mpi@2021.18.0
  - netcdf-c
  - netlib-scalapack@2.2.3+shared build_type=Release
  - openmpi@5.0.8
  - llvm-openmp
  - zlib
  - fmt
  - zstd
  - bazel
