spack:
  view: false
  concretizer:
    unify: when_possible
  packages:
    all:
      target:
      - icelake
      compiler:
      - gcc@13.4.0
    cuda:
      version:
      - '12.2'
    lammps:
      variants: +cuda cuda_arch=80
    nccl:
      variants: +cuda cuda_arch=80
  specs:
  - zlib@1.3.1
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-icelake-sm80-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
