spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - x86_64_v4
    c:
      prefer:
      - gcc@13.4.0
    cxx:
      prefer:
      - gcc@13.4.0
    fortran:
      prefer:
      - gcc@13.4.0
    llvm:
      version:
      - 17.0.6
      - 18.1.8
    clang:
      version:
      - 17.0.6
      - 18.1.8
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-x86_64_v4/gcc-13.3.0/gcc-13.4.0-isfd57qmlx2vukaklr5djoupyudhqdh6
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-x86_64_v4/gcc-13.3.0/gcc-13.4.0-isfd57qmlx2vukaklr5djoupyudhqdh6/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-x86_64_v4/gcc-13.3.0/gcc-13.4.0-isfd57qmlx2vukaklr5djoupyudhqdh6/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-x86_64_v4/gcc-13.3.0/gcc-13.4.0-isfd57qmlx2vukaklr5djoupyudhqdh6/bin/gfortran
    cuda:
      buildable: false
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-x86v4-cpu/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
