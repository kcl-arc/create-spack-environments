spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  modules:
    default:
      tcl:
        hide_implicits: true
        exclude:
        - gcc-runtime
        - glibc
        hash_length: 0
        naming_scheme: '{name}/{version}'
        projections:
          all: '{name}/{version}'
          hdf5+hl ^mpi: '{name}/{version}-hl-{^mpi.name}_{^mpi.version}'
          hdf5+hl: '{name}/{version}-hl'
          namd+cuda cuda_arch=61: '{name}/{version}-cuda61'
          namd+cuda cuda_arch=70: '{name}/{version}-cuda70'
          namd+cuda cuda_arch=75: '{name}/{version}-cuda75'
          namd+cuda cuda_arch=80: '{name}/{version}-cuda80'
          namd+cuda cuda_arch=86: '{name}/{version}-cuda86'
          namd+cuda cuda_arch=89: '{name}/{version}-cuda89'
          namd+cuda cuda_arch=90: '{name}/{version}-cuda90'
          namd+cuda cuda_arch=100: '{name}/{version}-cuda100'
          namd+avxtiles: '{name}/{version}-avxtiles'
          curl+libidn2: '{name}/{version}-idn2'
          fftw+openmp ^mpi: '{name}/{version}-omp-{^mpi.name}_{^mpi.version}'
          ^mpi: '{name}/{version}-{^mpi.name}_{^mpi.version}'
          ^hwloc: '{name}/{version}-hwloc_{^hwloc.version}'
          ^llvm: '{name}/{version}-{^llvm.name}_{^llvm.version}'
          ^python: '{name}/{version}-{^python.name}_{^python.version}'
          boost+container+icu: '{name}/{version}-container-icu'
          boost+container: '{name}/{version}-container'
          boost+icu: '{name}/{version}-icu'
          boost+pic: '{name}/{version}-pic'
          htslib~libcurl: '{name}/{version}-nocurl'
          cgal ^boost+icu: '{name}/{version}-icu'
          cmake@3.31.11 ^curl+libidn2: '{name}/{version}-idn2'
          cmake@3.31.11 ^curl@:8.15: '{name}/{version}-curl_{^curl.version}'
          git ^curl@:8.15: '{name}/{version}-curl_{^curl.version}'
          gdal ^curl+libidn2: '{name}/{version}-idn2'
          proj ^curl+libidn2: '{name}/{version}-idn2'
          arrow ^cmake %curl+libidn2: '{name}/{version}-idn2'
          geos ^cmake %curl+libidn2: '{name}/{version}-idn2'
          eigen build_type=Release: '{name}/{version}-release'
          threads=openmp: '{name}/{version}-omp'
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_2_1/install/modules/env-zen4-sm89/
  packages:
    all:
      require:
      - target=zen4
    c:
      require:
      - any_of:
        - gcc target=zen4
        - nvhpc target=zen4
      prefer:
      - gcc@13.4.0
    cxx:
      require:
      - any_of:
        - gcc target=zen4
        - nvhpc target=zen4
      prefer:
      - gcc@13.4.0
    fortran:
      require:
      - any_of:
        - gcc target=zen4
        - nvhpc target=zen4
      prefer:
      - gcc@13.4.0
    llvm:
      require: target=zen4
      version:
      - 18.1.8
    clang:
      require: target=zen4
      version:
      - 18.1.8
    intel-oneapi-compilers:
      require: target=zen4
    boost:
      require: '@1.77: target=zen4'
    libxml2:
      require: '@2.13.9 target=zen4'
    petsc:
      require: +batch target=zen4
    mctc-lib:
      require: '@0.5.1: target=zen4'
    xtb:
      require: ~tblite target=zen4
    curl:
      require: +libidn2 target=zen4
    openmpi:
      require:
      - target=zen4
    r:
      require:
      - target=zen4
    gcc:
      externals:
      - spec: gcc@14.3.1 target=zen4 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 target=zen4 languages:='c,c++,fortran'
        prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf
        extra_attributes:
          compilers:
            c: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf/bin/gcc
            cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf/bin/g++
            fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-zen4/gcc-14.3.1/gcc-13.4.0-lv6yyoj5u5v7trjt667nddsoaj5xo7sf/bin/gfortran
    cuda:
      version:
      - '13.3'
    lammps:
      variants: +cuda cuda_arch=89
    nccl:
      variants: +cuda cuda_arch=89
  specs:
  - gcc@13.4.0
  - gcc@11.5.0
  - cmake@3.31.11
  - curl
  - hdf5@1.14.6~mpi +hl
  - hdf5@1.14.6+mpi +hl ^openmpi@5.0.8
