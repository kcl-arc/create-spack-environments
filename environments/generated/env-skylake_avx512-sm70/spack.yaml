spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require:
      - skylake_avx512
      providers:
        awk:
        - gawk
        blas:
        - openblas
        - amdblis
        D:
        - ldc
        daal:
        - intel-daal
        elf:
        - elfutils
        fftw-api:
        - fftw
        - amdfftw
        flame:
        - libflame
        - amdlibflame
        fuse:
        - libfuse
        gl:
        - mesa+opengl
        - mesa18
        - opengl
        glu:
        - mesa-glu
        - openglu
        glx:
        - mesa+glx
        - mesa18+glx
        - opengl
        golang:
        - gcc
        iconv:
        - libiconv
        ipp:
        - intel-ipp
        java:
        - openjdk
        - jdk
        - ibm-java
        jpeg:
        - libjpeg-turbo
        - libjpeg
        lapack:
        - openblas
        - amdlibflame
        libllvm:
        - llvm
        - llvm-amdgpu
        lua-lang:
        - lua
        - lua-luajit
        mariadb-client:
        - mariadb-c-client
        - mariadb
        mkl:
        - intel-mkl
        mpe:
        - mpe2
        mpi:
        - openmpi
        - mpich
        mysql-client:
        - mysql
        - mariadb-c-client
        opencl:
        - pocl
        onedal:
        - intel-oneapi-dal
        osmesa:
        - mesa+osmesa
        - mesa18+osmesa
        pbs:
        - openpbs
        - torque
        pil:
        - py-pillow
        pkgconfig:
        - pkgconf
        - pkg-config
        rpc:
        - libtirpc
        scalapack:
        - netlib-scalapack
        - amdscalapack
        sycl:
        - hipsycl
        szip:
        - libaec
        - libszip
        tbb:
        - intel-tbb
        unwind:
        - libunwind
        uuid:
        - util-linux-uuid
        - libuuid
        xxd:
        - xxd-standalone
        - vim
        yacc:
        - bison
        - byacc
        ziglang:
        - zig
    c:
      prefer:
      - gcc@12.5.0
    cxx:
      prefer:
      - gcc@12.5.0
    fortran:
      prefer:
      - gcc@12.5.0
    llvm:
      version:
      - 15.0.7
    clang:
      version:
      - 15.0.7
    boost:
      require: '@1.77:'
    gcc:
      externals:
      - spec: gcc@14.3.1 target=skylake_avx512 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@12.5.0 target=skylake_avx512 languages:='c,c++,fortran'
        prefix: /software/spack_v1_2_1/install/apps/linux-almalinux10-skylake_avx512/gcc-14.3.1/gcc-12.5.0-rk25kfsahuec4bnpcs6won7vvotyspa7
        extra_attributes:
          compilers:
            c: /software/spack_v1_2_1/install/apps/linux-almalinux10-skylake_avx512/gcc-14.3.1/gcc-12.5.0-rk25kfsahuec4bnpcs6won7vvotyspa7/bin/gcc
            cxx: /software/spack_v1_2_1/install/apps/linux-almalinux10-skylake_avx512/gcc-14.3.1/gcc-12.5.0-rk25kfsahuec4bnpcs6won7vvotyspa7/bin/g++
            fortran: /software/spack_v1_2_1/install/apps/linux-almalinux10-skylake_avx512/gcc-14.3.1/gcc-12.5.0-rk25kfsahuec4bnpcs6won7vvotyspa7/bin/gfortran
    cuda:
      version:
      - '12.8'
    lammps:
      variants: +cuda cuda_arch=70
    nccl:
      variants: +cuda cuda_arch=70
  specs:
  - gcc@12.5.0
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_2_1/install/modules/env-skylake_avx512-sm70/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}'
        projections:
          all: '{name}/{version}'
          ^mpi: '{name}/{version}-{^mpi.name}_{^mpi.version}'
          ^hwloc: '{name}/{version}-hwloc_{^hwloc.version}'
          ^llvm: '{name}/{version}-{^llvm.name}_{^llvm.version}'
          ^python: '{name}/{version}-{^python.name}_{^python.version}'
          boost+container: '{name}/{version}-container'
          eigen build_type=Release: '{name}/{version}-release'
          threads=openmp: '{name}/{version}-omp'
        exclude:
        - meson
        - ninja
        - re2c
        - cairo
        - glib
        - glib-bootstrap
        - gobject-introspection
        - harfbuzz
        - pixman
        - python-venv
        - py-attrs
        - py-calver
        - py-certifi
        - py-cffi
        - py-cryptography
        - py-cython
        - py-flit-core
        - py-gsutil
        - py-hatch-fancy-pypi-readme
        - py-hatch-vcs
        - py-hatchling
        - py-idna
        - py-markupsafe
        - py-maturin
        - py-multiqc
        - py-mysql-connector-python
        - py-packaging
        - py-pathspec
        - py-pillow
        - py-pip
        - py-pluggy
        - py-poetry-core
        - py-pycparser
        - py-pyparsing
        - py-pyyaml
        - py-requests
        - py-semantic-version
        - py-setuptools
        - py-setuptools-rust
        - py-setuptools-scm
        - py-six
        - py-trove-classifiers
        - py-typing-extensions
        - py-urllib3
        - py-wheel
  container:
    format: singularity
