spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - sapphirerapids
    c:
      prefer:
      - gcc@15.2.0
    cxx:
      prefer:
      - gcc@15.2.0
    fortran:
      prefer:
      - gcc@15.2.0
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@15.2.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-sapphirerapids/gcc-13.3.0/gcc-15.2.0-2nhdbowj6niqtttghpazloya2hrnuphu
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-sapphirerapids/gcc-13.3.0/gcc-15.2.0-2nhdbowj6niqtttghpazloya2hrnuphu/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-sapphirerapids/gcc-13.3.0/gcc-15.2.0-2nhdbowj6niqtttghpazloya2hrnuphu/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-sapphirerapids/gcc-13.3.0/gcc-15.2.0-2nhdbowj6niqtttghpazloya2hrnuphu/bin/gfortran
    cuda:
      version:
      - '12.8'
    lammps:
      variants: +cuda cuda_arch=89
    nccl:
      variants: +cuda cuda_arch=89
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-sapphirerapids-rtx6000_l40s-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
