spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - skylake_avx512
    c:
      prefer:
      - gcc@12.5.0
    cxx:
      prefer:
      - gcc@12.5.0
    fortran:
      prefer:
      - gcc@12.5.0
    llvm:
      version:
      - 15.0.7
    clang:
      version:
      - 15.0.7
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@12.5.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-12.5.0-zsjk6hibvffifypq4yzdeb4c5d7nifap/bin/gfortran
    cuda:
      buildable: false
  specs:
  - cmake@4.1.2
  - curl@8.15.0
  - hdf5@1.14.6~mpi +hl
  - hdf5@1.14.6+mpi +hl ^openmpi@5.0.8
  - intel-oneapi-compilers@2025.3.1
  - intel-oneapi-mkl@2025.3.0+shared threads=openmp
  - intel-oneapi-mpi@2021.17.0
  - netcdf-c@4.9.3
  - netlib-scalapack@2.2.2+shared build_type=Release
  - openmpi@5.0.8
  - llvm-openmp@20.1.8
  - zlib@1.3.1
  - fmt
  - zstd
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-skylake-cpu-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
        projections:
          all: '{name}/{version}-{compiler.name}-{compiler.version}'
          +mpi: '{name}/{version}-{compiler.name}-{compiler.version}-mpi'
  container:
    format: singularity
