spack:
  view: false
  concretizer:
    unify: when_possible
    reuse: false
  packages:
    all:
      target:
      - skylake_avx512
    c:
      prefer:
      - gcc@13.4.0
    cxx:
      prefer:
      - gcc@13.4.0
    fortran:
      prefer:
      - gcc@13.4.0
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@13.4.0 languages:='c,c++,fortran'
        prefix: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-13.4.0-k7nidb6fl34yq6s55ttaqojdbx6mlt5u
        extra_attributes:
          compilers:
            c: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-13.4.0-k7nidb6fl34yq6s55ttaqojdbx6mlt5u/bin/gcc
            cxx: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-13.4.0-k7nidb6fl34yq6s55ttaqojdbx6mlt5u/bin/g++
            fortran: /software/spack_v1_1_1/install/apps/linux-ubuntu24.04-skylake_avx512/gcc-13.3.0/gcc-13.4.0-k7nidb6fl34yq6s55ttaqojdbx6mlt5u/bin/gfortran
    cuda:
      buildable: false
  specs:
  - zlib@1.3.1
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_1_1/install/modules/env-skylake-cpu-test/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}-{compiler.name}-{compiler.version}'
  container:
    format: singularity
