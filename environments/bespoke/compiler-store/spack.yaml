spack:
  specs:
  - /isi54rzkepxc57felxolwefjvzhxpbja  # gcc@12.5.0 cascadelake
  - /t2negluj3ibo2lluvy3qsdba6dzqfnpi  # gcc@13.4.0 x86_64_v4
  - /lv6yyoj5u5v7trjt667nddsoaj5xo7sf  # gcc@13.4.0 zen4
  - /a25vi5rb45p63eecjz52hw4vqlj6dl53  # gcc@12.5.0 icelake
  - /ydbendvp4dwxt6ieh7nfxv5bj5wwzzj3  # gcc@13.4.0 sapphirerapids
  - /gugdkwubwh3fpeirqhnhvbvxfjryube4  # gcc@12.5.0 zen3
  - /x76m7vlxlsi3kwmc2fvtxvws7vvyzz5h  # gcc@12.5.0 zen2
  - /ppqz6sdptd563qh25zrqe47vy2sw4utm  # gcc@12.5.0 skylake_avx512
  view: false
  concretizer:
    unify: false
  packages:
    gcc:
      externals:
      - spec: gcc@14.3.1 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
  modules:
    default:
      enable:
      - tcl
      roots:
        tcl: /software/spack_v1_2_1/install/modules/compiler-store/
      tcl:
        hash_length: 0
        naming_scheme: '{name}/{version}'
        exclude:
        - gcc
