spack:
  view: false
  concretizer:
    unify: false
    reuse: false
  packages:
    all:
      require:
      - zen4
    gcc:
      externals:
      - spec: gcc@14.3.1 target=zen4 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    cuda:
      buildable: false
  specs:
  - gcc@13.4.0
